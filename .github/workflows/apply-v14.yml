name: Apply final v1.4 payload

on:
  push:
    branches: [release/v1.4-final]
    paths:
      - .github/v14-payload.part*
      - .github/workflows/apply-v14.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.4-final
          fetch-depth: 0

      - name: Apply and validate payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v14-payload.part* > /tmp/v14-payload.tar.gz.b64
          base64 -d /tmp/v14-payload.tar.gz.b64 > /tmp/v14-payload.tar.gz
          tar -xzf /tmp/v14-payload.tar.gz
          rm -f .github/v14-payload.part*

          test "$(sed -n 's/^version=//p' module.prop)" = "v1.4"
          test "$(sed -n 's/^versionCode=//p' module.prop)" = "142"
          ! grep -RIn 'v1\.4-r[0-9]' . --exclude-dir=.git

          sh -n bin/mcd-ctrl
          for file in bin/lib/*.sh; do sh -n "$file"; done
          sh -n bin/mcd-boot-scan
          sh -n bin/mcd-menu
          sh -n customize.sh
          python3 -m json.tool update.json >/dev/null

          test_root="$(mktemp -d)"
          mkdir -p "$test_root/modules" "$test_root/data" "$test_root/root"
          MCD_DIR="$test_root/data" \
          MCD_MODULES_DIR="$test_root/modules" \
          MCD_ROOT_DATA_ADB="$test_root/root" \
          sh bin/mcd-ctrl self-test --full
          rm -rf "$test_root"

      - name: Commit final v1.4 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Module Conflict Detector v1.4"
          git push origin HEAD:release/v1.4-final
